[project]
name = "payroll-tracker"
version = "0.1.0"
description = "Employee Payroll Tracker - computes payslips for full-time, contract and intern employees"
authors = [
    {name = "iToussaint",email = "toussaint.iradukunda@amalitech.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]
# The modules run directly (python main.py); nothing is built or installed.
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=1.18,<1.19)",
    "pycodestyle (>=2.15.0,<3.0.0)",
]

[tool.pytest.ini_options]
# Lets tests import main, employee, payroll and utils from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "employee.py", "payroll.py", "utils.py", "tests"]
strict = true
pretty = true

[tool.ruff]
# PEP 8 line length, so the editor's formatter stays within 79 characters.
line-length = 79
